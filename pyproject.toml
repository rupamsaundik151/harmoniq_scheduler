[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmoniq-scheduler"
version = "0.1.0"
description = "Celery + RedBeat scheduler service (replaces AWS Lambda + EventBridge trigger backend)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Rupam Kumari", email = "rupam.kumari@aria-is.com" },
]
keywords = ["celery", "redbeat", "scheduler", "harmoniq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "celery>=5.3,<6.0",
    "celery-redbeat>=2.0",
    "redis>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "flower>=2.0",
]

[project.urls]
Homepage = "https://github.com/ariaharmoniq/harmoniq-scheduler"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harmoniq_scheduler = ["py.typed"]
