apiVersion: v1
kind: Service
metadata:
  name: scheduler-api
  namespace: harmoniq-scheduler
spec:
  selector:
    app: scheduler-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-api
  namespace: harmoniq-scheduler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scheduler-api
  template:
    metadata:
      labels:
        app: scheduler-api
    spec:
      containers:
        - name: api
          image: harmoniq-scheduler:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - harmoniq_scheduler.main:app
            - --host=0.0.0.0
            - --port=8080
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: scheduler-config
            - secretRef:
                name: scheduler-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
